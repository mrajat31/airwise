name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-publish every two hours so official station readings stay fresh.
  schedule:
    - cron: "20 */2 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy only what passes lint, tests and build. Scheduled refreshes rebuild the same
  # commit that was already checked, so they skip this.
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Optional. Needs the OPENAQ_API_KEY repository secret; skipped without it.
      # The key is used only in this step and is never written into the site.
      - name: Fetch official station readings
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: node scripts/fetch-stations.mjs
      # Optional, privacy-friendly analytics. Set the PLAUSIBLE_DOMAIN (and, if self-hosting,
      # PLAUSIBLE_HOST) repository variables to turn it on. These values are public by nature.
      - name: Build site
        env:
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
